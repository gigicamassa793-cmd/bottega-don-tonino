<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Bottega di Don Tonino</title>
  <style>
    :root{--wine:#792b3a;--wine2:#9a4a55;--cream:#fbf7ef;--ink:#302723;--muted:#756b63;--line:#e9ded2}
    *{box-sizing:border-box}
    body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}
    header{background:linear-gradient(120deg,#54202b,#8d3949);color:#fff;padding:18px max(18px,calc((100% - 1120px)/2));display:flex;align-items:center;min-height:112px}
    .brand-logo{display:block;width:min(330px,78vw);height:auto;max-height:92px;object-fit:contain;object-position:left center;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
    main{max-width:1120px;margin:auto;padding:22px 16px 60px}
    .intro h1{font:28px Georgia,serif;margin:0 0 6px}.intro p{color:var(--muted);margin:0}
    h2{font:23px Georgia,serif}.sectors{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .sector{display:flex;align-items:center;gap:12px;min-height:70px;border:1px solid rgba(123,41,62,.2);border-radius:15px;background:#7b293e;color:#fff;padding:13px 15px;text-align:left;cursor:pointer;box-shadow:0 3px 9px rgba(80,30,40,.10);transition:transform .15s,background .15s}
    .sector:hover{background:#682335;transform:translateY(-1px)}
    .sector-icon{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.32);box-shadow:inset 0 0 10px rgba(255,255,255,.08)}
    .sector-icon svg,.feature-icon svg{width:34px;height:34px;display:block;overflow:visible}
    .sector-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
    .sector strong{display:block;color:#fff;font-size:15px;line-height:1.2}.sector small{color:rgba(255,255,255,.82);font-size:12px}
    .toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 14px}
    .toolbar input,.toolbar select{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;font-size:14px}
    .toolbar input{flex:1;min-width:210px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
    .products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
    .photo{height:170px;background:#f0e3d5;display:grid;place-items:center;font-size:28px;overflow:hidden;padding:8px}
    .photo img{width:100%;height:100%;object-fit:contain;display:block}
    .feature-section{grid-column:1/-1;min-width:0}
    .feature-title{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;
      min-height:66px;
      font:700 20px Arial,Helvetica,sans-serif;
      color:#fff;
      background:#7b293e;
      margin:12px 0 15px;
      padding:14px 19px;
      border-radius:15px;
      border:1px solid rgba(123,41,62,.18);
      box-shadow:0 3px 9px rgba(80,30,40,.12);
      letter-spacing:.01em;
      overflow:hidden;
    }
    .feature-icon{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:42px;
      height:42px;
      flex:0 0 42px;
      border-radius:12px;
      background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.08));
      border:1px solid rgba(255,255,255,.3);
      box-shadow:0 2px 6px rgba(0,0,0,.12);
      font-family:system-ui,sans-serif;
      font-size:23px;
      line-height:1;
    }
    .feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .feature-card{position:relative}
    @media(max-width:850px){.feature-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:500px){.photo{height:145px}.feature-grid{gap:8px}}
    .info{padding:11px}.cat{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--wine2);font-weight:bold}
    .name{font:17px Georgia,serif;margin:6px 0;line-height:1.2}.format{font-size:12px;color:var(--muted)}
    .bottom{display:flex;justify-content:space-between;align-items:center;gap:7px;margin-top:10px}
    .price{font-weight:bold;color:var(--wine)}
    button{cursor:pointer}.add,.primary,.checkout{border:0;background:var(--wine);color:#fff;border-radius:9px;padding:9px 11px;font-weight:bold}
    .cart{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;position:sticky;top:10px}
    .cart h2{margin:0 0 10px}.empty{color:var(--muted);font-size:13px}
    .cartline{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:9px 0;font-size:13px}
    .qty button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 7px}
    .total{display:flex;justify-content:space-between;font-weight:bold;padding:14px 0}.checkout{width:100%;padding:12px}
    .backdrop{display:none;position:fixed;inset:0;background:#20191699;z-index:5;align-items:center;justify-content:center;padding:15px}
    .modal{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px}
    .close{float:right;border:0;background:#f2ebe4;border-radius:8px;padding:7px 10px}
    .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#302723;color:#fff;padding:11px 16px;border-radius:20px;display:none;z-index:10}
    .status{padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px;color:var(--muted);grid-column:1/-1}
    @media(max-width:850px){.layout{grid-template-columns:1fr}.cart{position:static;order:-1}.products{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:500px){.products{gap:8px}.photo{height:145px}.name{font-size:15px}.info{padding:9px}}
  </style>
</head>

  <main>
    <section class="intro">
      <h1>Benvenuti in Bottega</h1>
      <p>Cerca, scegli e aggiungi al carrello</p>
    </section>

    <h2>I nostri settori</h2>
    <div class="sectors" id="sectors"></div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Cerca un prodotto…" aria-label="Cerca un prodotto">
      <select id="category" aria-label="Filtra per settore">
        <option value="">Tutti i settori</option>
      </select>
    </div>

    <div class="layout">
      <section class="products" id="products">
        <div class="status">Caricamento catalogo…</div>
      </section>

      <aside class="cart">
        <h2>Il tuo carrello</h2>
        <div id="cartItems" class="empty">Il carrello è vuoto.</div>
        <div class="total"><span>Totale prodotti</span><span id="total">€ 0,00</span></div>
        <button class="checkout" id="checkoutButton" type="button">Procedi con l'ordine</button>
      </aside>
    </div>
  </main>

  <div class="backdrop" id="detail" role="dialog" aria-modal="true" aria-label="Dettaglio prodotto">
    <div class="modal">
      <button class="close" id="closeDetail" type="button">Chiudi ✕</button>
      <div id="detailBody"></div>
    </div>
  </div>

  <div class="backdrop" id="order" role="dialog" aria-modal="true" aria-label="Riepilogo ordine">
    <div class="modal">
      <button class="close" id="closeOrder" type="button">Chiudi ✕</button>
      <h2>Riepilogo ordine</h2>
      <p>Questa è una prova del catalogo e del carrello. L'invio degli ordini sarà attivato in una fase successiva.</p>
      <div id="orderBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    'use strict';

    let DATA = [];
    const CART = {};
    const $ = id => document.getElementById(id);
    const euro = n => '€ ' + Number(n).toFixed(2).replace('.', ',');
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    })[ch]);

    function showStatus(message) {
      $('products').innerHTML = '<div class="status">' + esc(message) + '</div>';
    }

    // Usa il collegamento pubblico OneDrive in modalità download:
    // il browser riceve il file immagine invece della pagina di anteprima.
    function getPhotoUrl(sharedUrl) {
      const url = String(sharedUrl || '').trim();
      if (!url) return '';

      // Google Drive: trasforma /file/d/ID/view in un URL immagine diretto.
      const driveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/i) ||
                         url.match(/[?&]id=([a-zA-Z0-9_-]+)/i);
      if (driveMatch && /drive\.google\.com/i.test(url)) {
        return 'https://drive.google.com/thumbnail?id=' +
          encodeURIComponent(driveMatch[1]) + '&sz=w1200';
      }

      // OneDrive: usa il link pubblico in modalità download.
      if (/^https?:\/\/(1drv\.ms|onedrive\.live\.com|[^/]+\.sharepoint\.com)/i.test(url)) {
        const cleanUrl = url.replace(/[?&]download=1\b/i, '');
        return cleanUrl + (cleanUrl.includes('?') ? '&' : '?') + 'download=1';
      }

      return url;
    }

    function photoMarkup(product) {
      const photoUrl = getPhotoUrl(product.photo);
      if (!photoUrl) return '<div class="photo no-photo">📷 Foto non inserita</div>';
      return '<div class="photo"><img loading="lazy" referrerpolicy="no-referrer" src="' +
        esc(photoUrl) + '" alt=""></div>';
    }

    const API_URL = 'https://script.google.com/macros/s/AKfycbzvuKNvHUdpe_Iq0plRkTwScfvyhOMYYj14tF7untDTzYxvcOt8TCtHHtZxD-M-kZOz/exec';
    let catalogRequestTimer = null;

    // Caricamento compatibile con GitHub Pages: JSONP al posto di google.script.run.
    function loadCatalog() {
      showStatus('Collegamento al catalogo in corso…');
      const callbackName = 'donToninoCatalog_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
      const script = document.createElement('script');
      let finished = false;

      function cleanup() {
        clearTimeout(catalogRequestTimer);
        delete window[callbackName];
        script.remove();
      }

      window[callbackName] = function(result) {
        if (finished) return;
        finished = true;
        cleanup();
        if (!result || !Array.isArray(result.products)) {
          showStatus('Il catalogo ha restituito una risposta non valida.');
          return;
        }
        DATA = result.products;
        buildSectors(Array.isArray(result.categories) ? result.categories : []);
        renderProducts();
        renderCart();
        if (DATA.length === 0) {
          showStatus('Non ci sono prodotti pubblicati con prezzo valido. Controlla le due colonne di pubblicazione nel foglio Catalogo (2).');
        }
      };

      script.onerror = function() {
        if (finished) return;
        finished = true;
        cleanup();
        showStatus('Non riesco a raggiungere il catalogo. Verifica che la Web App Apps Script sia pubblicata con accesso “Chiunque”.');
      };

      script.src = API_URL + '?action=catalog&callback=' + encodeURIComponent(callbackName) + '&_=' + Date.now();
      catalogRequestTimer = setTimeout(function() {
        if (finished) return;
        finished = true;
        cleanup();
        showStatus('Il catalogo non risponde. Riprova tra qualche istante.');
      }, 20000);
      document.head.appendChild(script);
    }

    function luminaryMarkup() {
      // Motivo originale ispirato alle luminarie salentine: arco, stella e lampadine colorate.
      return '<svg viewBox="0 0 64 64" role="presentation" aria-hidden="true">' +
        '<path d="M9 49V30C9 17.3 19.3 7 32 7s23 10.3 23 23v19" fill="none" stroke="#f7d98a" stroke-width="3.2" stroke-linecap="round"/>' +
        '<path d="M15 49V31c0-9.4 7.6-17 17-17s17 7.6 17 17v18" fill="none" stroke="#fff1c7" stroke-width="1.8" stroke-dasharray="2.5 3"/>' +
        '<path d="M5 51h54M11 56h42" stroke="#f7d98a" stroke-width="2.4" stroke-linecap="round"/>' +
        '<path d="M32 18l3.2 7.2 7.8.6-5.9 5.1 1.8 7.6-6.9-4-6.9 4 1.8-7.6-5.9-5.1 7.8-.6z" fill="#f4c95d" stroke="#fff0bd" stroke-width="1"/>' +
        '<circle cx="16" cy="29" r="3.1" fill="#ef8b78"/><circle cx="48" cy="29" r="3.1" fill="#74d3c2"/>' +
        '<circle cx="12" cy="41" r="2.6" fill="#f4c95d"/><circle cx="52" cy="41" r="2.6" fill="#ef8b78"/>' +
        '<circle cx="22" cy="15" r="2.5" fill="#74d3c2"/><circle cx="42" cy="15" r="2.5" fill="#f4c95d"/>' +
        '</svg>';
    }

    function iconForSector(title) {
      return luminaryMarkup();
    }

    function buildSectors(categories) {
      $('sectors').innerHTML = '';
      const select = $('category');
      select.innerHTML = '<option value="">Tutti i settori</option>';
      const counts = {};
      DATA.forEach(product => {
        counts[product.category] = (counts[product.category] || 0) + 1;
      });

      categories.forEach(category => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'sector';
        button.innerHTML = '<span class="sector-icon" aria-hidden="true">' + iconForSector(category) + '</span><span class="sector-copy"><strong>' + esc(category) + '</strong><small>' + (counts[category] || 0) + ' prodotti</small></span>';
        button.addEventListener('click', function() {
          select.value = category;
          renderProducts();
          $('products').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        $('sectors').appendChild(button);

        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        select.appendChild(option);
      });
    }

    function getFilteredProducts() {
      const query = $('search').value.trim().toLocaleLowerCase('it');
      const category = $('category').value;
      return DATA.filter(product => {
        const matchesCategory = !category || product.category === category;
        const searchable = [product.name, product.category, product.code].join(' ').toLocaleLowerCase('it');
        return matchesCategory && (!query || searchable.includes(query));
      }).sort((a, b) => String(a.name).localeCompare(String(b.name), 'it'));
    }

    function productPrice(product) {
      return product.promo !== null && product.promo !== undefined ? product.promo : product.price;
    }

    function createProductCard(product, container, isFeatured = false) {
      const key = product.code || product.name;
      const card = document.createElement('article');
      card.className = 'card' + (isFeatured ? ' feature-card' : '');
      card.tabIndex = 0;

      card.innerHTML = photoMarkup(product) +
        '<div class="info">'+
          '<div class="cat">' + esc(product.category) + '</div>' +
          '<div class="name">' + esc(product.name) + '</div>' +
          (product.format ? '<div class="format">Formato: ' + esc(product.format) + '</div>' : '') +
          '<div class="bottom"><span class="price">' + euro(productPrice(product)) + '</span><button class="add" type="button">Aggiungi</button></div>' +
        '</div>';

      const cardImage = card.querySelector('.photo img');
      if (cardImage) {
        cardImage.addEventListener('error', function() {
          this.parentElement.classList.add('no-photo');
          this.parentElement.textContent = '📷 Foto non disponibile';
        }, { once: true });
      }

      card.addEventListener('click', () => openDetail(key));
      card.addEventListener('keydown', event => {
        if (event.key === 'Enter') openDetail(key);
      });
      card.querySelector('.add').addEventListener('click', event => {
        event.stopPropagation();
        addToCart(key);
      });
      container.appendChild(card);
    }

    function renderProducts() {
      const container = $('products');
      container.innerHTML = '';

      const query = $('search').value.trim();
      const category = $('category').value;
      const hasFilter = Boolean(query || category);
      const products = getFilteredProducts();

      if (hasFilter) {
        if (!products.length) {
          container.innerHTML = '<div class="status">Nessun prodotto trovato.</div>';
          return;
        }
        products.forEach(product => createProductCard(product, container));
        return;
      }

      // All'apertura mostra soltanto i prodotti con il campo "In evidenza" compilato.
      const featured = DATA.filter(product => String(product.featuredTitle || '').trim());
      if (!featured.length) {
        container.innerHTML = '<div class="status">Non ci sono ancora prodotti in evidenza. Puoi selezionare un settore o cercare un prodotto.</div>';
        return;
      }

      // Raggruppa i prodotti in base al testo inserito nella colonna "In evidenza".
      const groups = new Map();
      featured.forEach(product => {
        const title = String(product.featuredTitle).trim();
        if (!groups.has(title)) groups.set(title, []);
        groups.get(title).push(product);
      });

      groups.forEach((groupProducts, title) => {
        const section = document.createElement('section');
        section.className = 'feature-section';

        const heading = document.createElement('h2');
        heading.className = 'feature-title';

        // Piccola luminarie salentina decorativa per ogni settore.

        const icon = document.createElement('span');
        icon.className = 'feature-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.innerHTML = luminaryMarkup();

        const titleText = document.createElement('span');
        titleText.textContent = title;
        heading.appendChild(icon);
        heading.appendChild(titleText);

        const grid = document.createElement('div');
        grid.className = 'feature-grid';

        section.appendChild(heading);
        section.appendChild(grid);
        container.appendChild(section);

        groupProducts.forEach(product => createProductCard(product, grid, true));
      });
    }

    function openDetail(key) {
      const product = DATA.find(item => (item.code || item.name) === key);
      if (!product) return;

      const fields = [
        ['Descrizione', product.description],
        ['Ingredienti', product.ingredients],
        ['Allergeni', product.allergens],
        ['Conservazione', product.storage]
      ].filter(field => String(field[1] || '').trim());

      $('detailBody').innerHTML =
        '<div class="cat">' + esc(product.category) + '</div>' +
        '<h2>' + esc(product.name) + '</h2>' +
        (product.photo ? '<img id="detailPhoto" loading="lazy" referrerpolicy="no-referrer" style="width:100%;max-height:230px;object-fit:contain" src="' + esc(getPhotoUrl(product.photo)) + '" alt="">' : '') +
        (product.format ? '<p>Formato: ' + esc(product.format) + '</p>' : '') +
        '<h3 style="color:var(--wine)">' + euro(productPrice(product)) + '</h3>' +
        fields.map(field => '<p><b>' + esc(field[0]) + ':</b> ' + esc(field[1]) + '</p>').join('') +
        '<button class="primary" id="detailAdd" type="button">Aggiungi al carrello</button>';

      const detailPhoto = $('detailPhoto');
      if (detailPhoto) detailPhoto.addEventListener('error', function() { this.style.display = 'none'; }, { once: true });

      $('detailAdd').addEventListener('click', function() {
        addToCart(key);
        closeDetail();
      });
      $('detail').style.display = 'flex';
    }

    function closeDetail() { $('detail').style.display = 'none'; }
    function closeOrder() { $('order').style.display = 'none'; }

    function addToCart(key) {
      CART[key] = (CART[key] || 0) + 1;
      renderCart();
      toast('Prodotto aggiunto al carrello');
    }

    function changeQuantity(key, delta) {
      CART[key] = (CART[key] || 0) + delta;
      if (CART[key] <= 0) delete CART[key];
      renderCart();
    }

    function renderCart() {
      const container = $('cartItems');
      const keys = Object.keys(CART);
      let total = 0;
      container.innerHTML = '';

      if (!keys.length) {
        container.className = 'empty';
        container.textContent = 'Il carrello è vuoto.';
      } else {
        container.className = '';
        keys.forEach(key => {
          const product = DATA.find(item => (item.code || item.name) === key);
          if (!product) return;
          const price = productPrice(product);
          total += price * CART[key];

          const line = document.createElement('div');
          line.className = 'cartline';
          line.innerHTML = '<span>' + esc(product.name) + '<br><b>' + euro(price * CART[key]) + '</b></span>' +
            '<span class="qty"><button type="button" aria-label="Diminuisci quantità">−</button> ' + CART[key] + ' <button type="button" aria-label="Aumenta quantità">+</button></span>';
          const buttons = line.querySelectorAll('button');
          buttons[0].addEventListener('click', () => changeQuantity(key, -1));
          buttons[1].addEventListener('click', () => changeQuantity(key, 1));
          container.appendChild(line);
        });
      }
      $('total').textContent = euro(total);
    }

    function checkout() {
      const keys = Object.keys(CART);
      if (!keys.length) {
        toast('Aggiungi prima un prodotto');
        return;
      }
      $('orderBody').innerHTML = keys.map(key => {
        const product = DATA.find(item => (item.code || item.name) === key);
        return product ? '<p>' + esc(product.name) + ' × ' + CART[key] + '</p>' : '';
      }).join('') + '<b>Totale: ' + $('total').textContent + '</b>';
      $('order').style.display = 'flex';
    }

    function toast(message) {
      $('toast').textContent = message;
      $('toast').style.display = 'block';
      window.setTimeout(() => { $('toast').style.display = 'none'; }, 1600);
    }

    // Collega i controlli e avvia automaticamente la lettura di Google Sheets.
    document.addEventListener('DOMContentLoaded', function() {
      $('search').addEventListener('input', renderProducts);
      $('category').addEventListener('change', renderProducts);
      $('closeDetail').addEventListener('click', closeDetail);
      $('closeOrder').addEventListener('click', closeOrder);
      $('detail').addEventListener('click', event => {
        if (event.target === $('detail')) closeDetail();
      });
      $('checkoutButton').addEventListener('click', checkout);
      loadCatalog();
    });
  </script>
</body>
</html>
